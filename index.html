 TURBO LOTTO AI REALTIME

<head>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

Turbo Lotto AI Realtime
</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<!-- FIREBASE -->

<script type="module">

import {
initializeApp
}
from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {

getDatabase,
ref,
set,
get,
child,
onValue

}
from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

/* =========================
 FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey:
"YOUR_API_KEY",

authDomain:
"YOUR_PROJECT.firebaseapp.com",

databaseURL:
"https://YOUR_PROJECT-default-rtdb.firebaseio.com",

projectId:
"YOUR_PROJECT",

storageBucket:
"YOUR_PROJECT.appspot.com",

messagingSenderId:
"123456",

appId:
"APP_ID"

};

/* =========================
 INIT FIREBASE
========================= */

const app=
initializeApp(firebaseConfig);

const db=
getDatabase(app);

/* =========================
 GLOBAL
========================= */

window.historyData={

thai:[],

lao:[]

};

window.currentMode='thai';

window.aiModel=null;

window.isTraining=false;

/* =========================
 ELEMENTS
========================= */

const thaiBtn=
document.getElementById('thaiBtn');

const laoBtn=
document.getElementById('laoBtn');

const generateBtn=
document.getElementById('generateBtn');

const historyContainer=
document.getElementById('historyContainer');

const mainContainer=
document.getElementById('mainContainer');

const threeContainer=
document.getElementById('threeContainer');

const twoContainer=
document.getElementById('twoContainer');

const bottomContainer=
document.getElementById('bottomContainer');

const hotDigits=
document.getElementById('hotDigits');

const aiStatus=
document.getElementById('aiStatus');

/* =========================
 FIREBASE LOAD
========================= */

async function loadRealtimeData(){

onValue(

ref(db,'lotto'),

(snapshot)=>{

const data=
snapshot.val();

if(data){

historyData.thai=
data.thai || [];

historyData.lao=
data.lao || [];

renderHistory();

renderHotDigits();

}

}

);

}

/* =========================
 AUTO FETCH THAI
========================= */

async function fetchThai(){

try{

const response=
await fetch(
'https://lotto.api.rayriffy.com/latest'
);

const data=
await response.json();

const firstPrize=
data.response.prizes.find(
p=>p.id==='first'
);

const lastTwo=
data.response.runningNumbers.find(
n=>n.id==='lastTwo'
);

const result={

date:data.response.date,

main:firstPrize.number,

bottom:lastTwo.number

};

const exists=
historyData.thai.some(
x=>x.date===result.date
);

if(!exists){

historyData.thai.unshift(result);

historyData.thai=
historyData.thai.slice(0,500);

saveRealtime();

await retrainAI();

}

}catch(error){

console.log(error);

}

}

/* =========================
 AUTO FETCH LAO
========================= */

async function fetchLao(){

try{

const response=
await fetch(
'https://YOUR-LAO-API.com/latest'
);

const data=
await response.json();

const result={

date:data.date,

main:data.number

};

const exists=
historyData.lao.some(
x=>x.date===result.date
);

if(!exists){

historyData.lao.unshift(result);

historyData.lao=
historyData.lao.slice(0,500);

saveRealtime();

await retrainAI();

}

}catch(error){

console.log(error);

}

}

/* =========================
 SAVE FIREBASE
========================= */

async function saveRealtime(){

await set(

ref(db,'lotto'),

{

thai:historyData.thai,

lao:historyData.lao

}

);

}

/* =========================
 HOT DIGITS
========================= */

function getHotDigits(){

const freq={};

for(let i=0;i<=9;i++){

freq[i]=0;

}

historyData[currentMode]
.forEach((item,index)=>{

const weight=
historyData[currentMode].length-index;

item.main
.split('')
.forEach(n=>{

freq[n]+=weight;

});

});

return Object.entries(freq)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

}

/* =========================
 RENDER HOT
========================= */

function renderHotDigits(){

hotDigits.innerHTML='';

const hot=
getHotDigits();

hot.forEach(item=>{

const div=
document.createElement('div');

div.className=
'bg-slate-900 rounded-xl p-3 text-center';

div.innerHTML=`

<div class="text-2xl font-bold text-orange-400">

${item[0]}

</div>

<div class="text-xs text-slate-400">

score ${item[1]}

</div>

`;

hotDigits.appendChild(div);

});

}

/* =========================
 HISTORY
========================= */

function renderHistory(){

historyContainer.innerHTML='';

historyData[currentMode]
.forEach(item=>{

const div=
document.createElement('div');

div.className=
'bg-slate-900 rounded-2xl p-4';

if(currentMode==='thai'){

div.innerHTML=`

<div class="flex justify-between">

<span class="text-emerald-400 text-xs">

${item.date}

</span>

<span class="text-yellow-400 text-xs">

 ${item.bottom}

</span>

</div>

<div class="text-2xl font-bold mt-2">

${item.main}

</div>

`;

}else{

const top=
item.main.slice(-2);

const bottom=
item.main.slice(0,2);

div.innerHTML=`

<div class="flex justify-between">

<span class="text-red-400 text-xs">

${item.date}

</span>

</div>

<div class="text-2xl font-bold mt-2">

${item.main}

</div>

<div class="text-xs text-slate-400 mt-2">

 ${top} |  ${bottom}

</div>

`;

}

historyContainer.appendChild(div);

});

}

/* =========================
 NORMALIZE
========================= */

function normalize(num){

return num/9;

}

function denormalize(num){

return Math.round(num*9);

}

/* =========================
 DATASET
========================= */

function createDataset(){

const dataset=[];

historyData[currentMode]
.forEach(item=>{

const nums=
item.main
.split('')
.map(Number)
.map(normalize);

dataset.push(nums);

});

return dataset;

}

/* =========================
 TRAIN DATA
========================= */

function prepareTrainingData(){

const dataset=
createDataset();

const xs=[];
const ys=[];

for(
let i=0;
i<dataset.length-1;
i++
){

xs.push(dataset[i]);

ys.push(dataset[i+1]);

}

return{

xs:tf.tensor2d(xs),

ys:tf.tensor2d(ys)

};

}

/* =========================
 CREATE MODEL
========================= */

async function createModel(){

const inputSize=
currentMode==='thai'
?6
:4;

aiModel=tf.sequential();

aiModel.add(

tf.layers.dense({

units:128,

activation:'relu',

inputShape:[inputSize]

})

);

aiModel.add(

tf.layers.dropout({
rate:.2
})

);

aiModel.add(

tf.layers.dense({

units:64,

activation:'relu'

})

);

aiModel.add(

tf.layers.dense({

units:32,

activation:'relu'

})

);

aiModel.add(

tf.layers.dense({

units:inputSize,

activation:'sigmoid'

})

);

aiModel.compile({

optimizer:'adam',

loss:'meanSquaredError'

});

}

/* =========================
 TRAIN AI
========================= */

async function retrainAI(){

if(isTraining){

return;

}

if(historyData[currentMode]
.length<5){

return;

}

isTraining=true;

aiStatus.innerText=
'Training AI...';

const data=
prepareTrainingData();

await createModel();

await aiModel.fit(

data.xs,

data.ys,

{

epochs:40,

shuffle:true,

validationSplit:.2

}

);

data.xs.dispose();
data.ys.dispose();

aiStatus.innerText=
'AI Ready';

isTraining=false;

}

/* =========================
 PREDICT
========================= */

async function predictAI(){

const latest=
historyData[currentMode][0]
.main
.split('')
.map(Number)
.map(normalize);

const input=
tf.tensor2d([latest]);

const prediction=
aiModel.predict(input);

const values=
await prediction.data();

input.dispose();
prediction.dispose();

let result='';

values.forEach(v=>{

const num=
denormalize(v);

result+=
Math.abs(num)%10;

});

return result;

}

/* =========================
 BALLS
========================= */

function renderBalls(
container,
number,
color
){

container.innerHTML='';

number.split('')
.forEach(n=>{

const div=
document.createElement('div');

div.className=
`ball ${color}`;

div.innerText=n;

container.appendChild(div);

});

}

/* =========================
 GENERATE
========================= */

async function generateAI(){

if(!aiModel){

return;

}

generateBtn.disabled=true;

generateBtn.innerText=
'...';

const number=
await predictAI();

const three=
number.slice(-3);

const two=
number.slice(-2);

let bottom='';

if(currentMode==='thai'){

bottom=
Math.floor(Math.random()*10)
+
''
+
Math.floor(Math.random()*10);

}else{

bottom=
number.slice(0,2);

}

renderBalls(
mainContainer,
number,
'bg-gradient-to-br from-emerald-500 to-teal-700'
);

renderBalls(
threeContainer,
three,
'bg-gradient-to-br from-violet-500 to-indigo-700'
);

renderBalls(
twoContainer,
two,
'bg-gradient-to-br from-cyan-500 to-blue-700'
);

renderBalls(
bottomContainer,
bottom,
'bg-gradient-to-br from-yellow-500 to-orange-600'
);

generateBtn.disabled=false;

generateBtn.innerText=
'  AI';

}

/* =========================
 MODE
========================= */

thaiBtn.onclick=()=>{

currentMode='thai';

renderHistory();

renderHotDigits();

};

laoBtn.onclick=()=>{

currentMode='lao';

renderHistory();

renderHotDigits();

};

/* =========================
 AUTO UPDATE
========================= */

setInterval(()=>{

fetchThai();

fetchLao();

},300000);

/* =========================
 INIT
========================= */

window.onload=async()=>{

await loadRealtimeData();

await fetchThai();

await fetchLao();

await retrainAI();

generateBtn.onclick=
generateAI;

};

</script>
