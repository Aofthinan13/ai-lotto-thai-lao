<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Turbo Lotto AI Ultimate</title>

<!-- FONT -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap"
rel="stylesheet">

<!-- TAILWIND -->

<script src="https://cdn.tailwindcss.com"></script>

<!-- TENSORFLOW -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<style>

body{

  background:#020617;

  color:white;

  font-family:'Kanit',sans-serif;

}

.glass{

  background:rgba(255,255,255,.05);

  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,.08);

}

.ball{

  width:68px;

  height:68px;

  border-radius:999px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:28px;

  font-weight:bold;

  color:white;

  animation:pop .35s ease;

}

@keyframes pop{

  0%{

    transform:scale(.4);

    opacity:0;

  }

  100%{

    transform:scale(1);

    opacity:1;

  }

}

.loading{

  animation:pulse 1s infinite;

}

.card{

  background:#0f172a;

  border-radius:18px;

  padding:14px;

}

.bar{

  height:18px;

  border-radius:999px;

  transition:.5s;

}

.small{

  font-size:12px;

}

</style>

</head>

<body class="min-h-screen p-4">

<div class="max-w-md mx-auto">

<div class="glass rounded-3xl p-5 shadow-2xl">

<!-- TITLE -->

<h1 class="text-3xl font-bold text-center mb-2">

🎯 Turbo Lotto AI

</h1>

<p class="text-center text-cyan-400 mb-6">

Ultimate Neural Engine

</p>

<!-- MODE -->

<div class="flex gap-3 mb-6">

<button
id="thaiBtn"
class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold">

🇹🇭 หวยไทย

</button>

<button
id="laoBtn"
class="flex-1 bg-slate-800 py-3 rounded-xl font-bold">

🇱🇦 หวยลาว

</button>

</div>

<!-- GENERATE -->

<button
id="generateBtn"
class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 py-4 rounded-2xl font-bold text-lg mb-6">

🚀 วิเคราะห์ด้วย AI

</button>

<!-- STATUS -->

<div class="glass rounded-2xl p-4 mb-6">

<div class="flex justify-between">

<span>

AI STATUS

</span>

<span
id="aiStatus"
class="text-yellow-400">

กำลังโหลด...

</span>

</div>

</div>

<!-- MAIN -->

<div class="mb-6">

<h2 class="font-bold mb-3">

รางวัลหลัก

</h2>

<div
id="mainContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- 3 DIGIT -->

<div class="mb-6">

<h2 class="font-bold mb-3">

3 ตัวท้าย

</h2>

<div
id="threeContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- 2 DIGIT -->

<div class="mb-6">

<h2 class="font-bold mb-3">

2 ตัวท้าย

</h2>

<div
id="twoContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- BOTTOM -->

<div class="mb-6">

<h2 class="font-bold mb-3 text-yellow-400">

2 ตัวล่าง

</h2>

<div
id="bottomContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- CONFIDENCE -->

<div class="glass rounded-2xl p-4 mb-6">

<div class="flex justify-between mb-2">

<span>

AI Confidence

</span>

<span id="scoreText">

0%

</span>

</div>

<div class="w-full bg-slate-800 rounded-full overflow-hidden">

<div
id="scoreBar"
class="bar bg-gradient-to-r from-emerald-500 to-cyan-500 w-0">
</div>

</div>

</div>

<!-- HOT DIGITS -->

<div class="glass rounded-2xl p-4 mb-6">

<h2 class="font-bold mb-4">

🔥 Hot Digits

</h2>

<div
id="hotDigits"
class="grid grid-cols-5 gap-2">
</div>

</div>

<!-- HISTORY -->

<div class="glass rounded-2xl p-4">

<h2 class="font-bold mb-4">

📁 ผลย้อนหลังจริง

</h2>

<div
id="historyContainer"
class="space-y-3">
</div>

</div>

</div>

</div>

<script>

/* =========================
   GLOBAL
========================= */

let currentMode='thai';

let aiModel=null;

let isTraining=false;

/* =========================
   ELEMENTS
========================= */

const thaiBtn=
document.getElementById('thaiBtn');

const laoBtn=
document.getElementById('laoBtn');

const generateBtn=
document.getElementById('generateBtn');

const mainContainer=
document.getElementById('mainContainer');

const threeContainer=
document.getElementById('threeContainer');

const twoContainer=
document.getElementById('twoContainer');

const bottomContainer=
document.getElementById('bottomContainer');

const historyContainer=
document.getElementById('historyContainer');

const hotDigitsContainer=
document.getElementById('hotDigits');

const aiStatus=
document.getElementById('aiStatus');

/* =========================
   DATABASE
========================= */

const historyData={

thai:[],

lao:[

{date:'20 พ.ค.',main:'6384'},
{date:'18 พ.ค.',main:'4127'},
{date:'16 พ.ค.',main:'9751'},
{date:'14 พ.ค.',main:'1843'},
{date:'12 พ.ค.',main:'7218'},
{date:'10 พ.ค.',main:'3405'},
{date:'8 พ.ค.',main:'6651'}

]

};

/* =========================
   SAVE
========================= */

function saveData(){

localStorage.setItem(
'lotto-ai-data',
JSON.stringify(historyData)
);

}

/* =========================
   LOAD
========================= */

function loadData(){

const saved=
localStorage.getItem(
'lotto-ai-data'
);

if(saved){

const parsed=
JSON.parse(saved);

historyData.thai=
parsed.thai || [];

historyData.lao=
parsed.lao || historyData.lao;

}

}

/* =========================
   FETCH THAI REAL DATA
========================= */

async function fetchThaiHistory(){

try{

const response=
await fetch(
'https://lotto.api.rayriffy.com/latest'
);

const data=
await response.json();

const firstPrize=
data.response.prizes.find(
p=>p.id==='first'
);

const lastTwo=
data.response.runningNumbers.find(
n=>n.id==='lastTwo'
);

const result={

date:data.response.date,

main:firstPrize.number,

bottom:lastTwo.number

};

const exists=
historyData.thai.some(
x=>x.date===result.date
);

if(!exists){

historyData.thai.unshift(result);

historyData.thai=
historyData.thai.slice(0,100);

saveData();

}

}catch(error){

console.log(error);

}

}

/* =========================
   HOT DIGITS
========================= */

function getHotDigits(){

const freq={};

for(let i=0;i<=9;i++){

freq[i]=0;

}

historyData[currentMode]
.forEach((item,index)=>{

const weight=
historyData[currentMode].length-index;

item.main
.split('')
.forEach(n=>{

freq[n]+=weight;

});

});

return Object.entries(freq)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

}

/* =========================
   RENDER HOT
========================= */

function renderHotDigits(){

hotDigitsContainer.innerHTML='';

const hot=
getHotDigits();

hot.forEach(item=>{

const div=
document.createElement('div');

div.className=
'bg-slate-900 rounded-xl p-3 text-center';

div.innerHTML=`

<div class="text-2xl font-bold text-orange-400">

${item[0]}

</div>

<div class="small text-slate-400">

score ${item[1]}

</div>

`;

hotDigitsContainer.appendChild(div);

});

}

/* =========================
   HISTORY
========================= */

function renderHistory(){

historyContainer.innerHTML='';

historyData[currentMode]
.forEach(item=>{

const div=
document.createElement('div');

div.className='card';

if(currentMode==='thai'){

div.innerHTML=`

<div class="flex justify-between">

<span class="text-emerald-400 small">

${item.date}

</span>

<span class="text-yellow-400 small">

ล่าง ${item.bottom}

</span>

</div>

<div class="text-2xl font-bold mt-2 tracking-widest">

${item.main}

</div>

`;

}else{

const top=
item.main.slice(-2);

const bottom=
item.main.slice(0,2);

div.innerHTML=`

<div class="flex justify-between">

<span class="text-red-400 small">

${item.date}

</span>

</div>

<div class="text-2xl font-bold mt-2 tracking-widest">

${item.main}

</div>

<div class="small text-slate-400 mt-2">

บน ${top} | ล่าง ${bottom}

</div>

`;

}

historyContainer.appendChild(div);

});

}

/* =========================
   NORMALIZE
========================= */

function normalize(num){

return num/9;

}

function denormalize(num){

return Math.round(num*9);

}

/* =========================
   DATASET
========================= */

function createDataset(){

const dataset=[];

historyData[currentMode]
.forEach(item=>{

const nums=
item.main
.split('')
.map(Number)
.map(normalize);

dataset.push(nums);

});

return dataset;

}

/* =========================
   TRAINING DATA
========================= */

function prepareTrainingData(){

const dataset=
createDataset();

const xs=[];
const ys=[];

for(
let i=0;
i<dataset.length-1;
i++
){

xs.push(dataset[i]);

ys.push(dataset[i+1]);

}

return{

xs:tf.tensor2d(xs),

ys:tf.tensor2d(ys)

};

}

/* =========================
   CREATE MODEL
========================= */

async function createAIModel(){

const inputSize=
currentMode==='thai'
?6
:4;

aiModel=tf.sequential();

aiModel.add(

tf.layers.dense({

units:128,

activation:'relu',

inputShape:[inputSize]

})

);

aiModel.add(

tf.layers.dropout({
rate:.2
})

);

aiModel.add(

tf.layers.dense({

units:64,

activation:'relu'

})

);

aiModel.add(

tf.layers.dropout({
rate:.2
})

);

aiModel.add(

tf.layers.dense({

units:32,

activation:'relu'

})

);

aiModel.add(

tf.layers.dense({

units:inputSize,

activation:'sigmoid'

})

);

aiModel.compile({

optimizer:'adam',

loss:'meanSquaredError',

metrics:['mse']

});

}

/* =========================
   SAVE MODEL
========================= */

async function saveModel(){

await aiModel.save(
'localstorage://turbo-lotto-ai'
);

}

/* =========================
   LOAD MODEL
========================= */

async function loadModel(){

try{

aiModel=
await tf.loadLayersModel(
'localstorage://turbo-lotto-ai'
);

aiStatus.innerText=
'AI Ready';

return true;

}catch{

return false;

}

}

/* =========================
   TRAIN AI
========================= */

async function trainAI(){

if(isTraining){

return;

}

if(historyData[currentMode]
.length<5){

aiStatus.innerText=
'ข้อมูลน้อยเกินไป';

return;

}

isTraining=true;

aiStatus.innerText=
'กำลังเทรน AI...';

const data=
prepareTrainingData();

await createAIModel();

await aiModel.fit(

data.xs,

data.ys,

{

epochs:50,

shuffle:true,

validationSplit:.2,

callbacks:{

onEpochEnd:(epoch)=>{

aiStatus.innerText=

'Training '
+(epoch+1);

}

}

}

);

await saveModel();

data.xs.dispose();
data.ys.dispose();

aiStatus.innerText=
'AI พร้อมใช้งาน';

isTraining=false;

}

/* =========================
   PREDICT
========================= */

async function predictAI(){

const latest=
historyData[currentMode][0]
.main
.split('')
.map(Number)
.map(normalize);

const input=
tf.tensor2d([latest]);

const prediction=
aiModel.predict(input);

const values=
await prediction.data();

input.dispose();
prediction.dispose();

let result='';

values.forEach(v=>{

const num=
denormalize(v);

result+=
Math.abs(num)%10;

});

return result;

}

/* =========================
   CONFIDENCE
========================= */

function calculateConfidence(number){

let score=0;

const hot=
getHotDigits();

number.split('')
.forEach(digit=>{

hot.forEach(h=>{

if(h[0]===digit){

score+=18;

}

});

});

return Math.min(score,98);

}

/* =========================
   BALLS
========================= */

function renderBalls(
container,
number,
color
){

container.innerHTML='';

number.split('')
.forEach(n=>{

const div=
document.createElement('div');

div.className=
`ball ${color}`;

div.innerText=n;

container.appendChild(div);

});

}

/* =========================
   RANDOM
========================= */

function secureRandom(max){

const arr=
new Uint32Array(1);

crypto.getRandomValues(arr);

return arr[0]%max;

}

/* =========================
   GENERATE
========================= */

async function generateAI(){

if(!aiModel){

return;

}

generateBtn.disabled=true;

generateBtn.innerText=
'AI กำลังวิเคราะห์...';

const loading=
`<div class="ball loading bg-slate-700">⚡</div>`;

mainContainer.innerHTML=
loading;

threeContainer.innerHTML=
loading;

twoContainer.innerHTML=
loading;

bottomContainer.innerHTML=
loading;

setTimeout(async()=>{

const number=
await predictAI();

const three=
number.slice(-3);

const two=
number.slice(-2);

let bottom='';

if(currentMode==='thai'){

bottom=
String(
secureRandom(10)
)+
String(
secureRandom(10)
);

}else{

bottom=
number.slice(0,2);

}

renderBalls(
mainContainer,
number,
currentMode==='thai'
?
'bg-gradient-to-br from-emerald-500 to-teal-700'
:
'bg-gradient-to-br from-red-500 to-rose-700'
);

renderBalls(
threeContainer,
three,
'bg-gradient-to-br from-violet-500 to-indigo-700'
);

renderBalls(
twoContainer,
two,
'bg-gradient-to-br from-blue-500 to-cyan-700'
);

renderBalls(
bottomContainer,
bottom,
'bg-gradient-to-br from-yellow-500 to-orange-600'
);

const score=
calculateConfidence(number);

document
.getElementById('scoreText')
.innerText=
score+'%';

document
.getElementById('scoreBar')
.style.width=
score+'%';

generateBtn.disabled=false;

generateBtn.innerText=
'🚀 วิเคราะห์ด้วย AI';

},1200);

}

/* =========================
   MODE
========================= */

thaiBtn.onclick=()=>{

currentMode='thai';

thaiBtn.className=
'flex-1 bg-emerald-600 py-3 rounded-xl font-bold';

laoBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

renderHistory();

renderHotDigits();

};

laoBtn.onclick=()=>{

currentMode='lao';

laoBtn.className=
'flex-1 bg-red-600 py-3 rounded-xl font-bold';

thaiBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

renderHistory();

renderHotDigits();

};

/* =========================
   INIT
========================= */

async function init(){

loadData();

await fetchThaiHistory();

renderHistory();

renderHotDigits();

const loaded=
await loadModel();

if(!loaded){

await trainAI();

}

generateBtn.onclick=
generateAI;

}

init();

</script>

</body>
</html>
