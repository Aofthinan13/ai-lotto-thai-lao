<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turbo Lotto AI PRO MAX</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
  background:#020617;
  color:white;
  font-family:sans-serif;
}

.glass{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);
}

.ball{
  width:70px;
  height:70px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  color:white;
  animation:pop .4s ease;
}

@keyframes pop{
  0%{
    transform:scale(.5);
    opacity:0;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

.loading{
  animation:pulse 1s infinite;
}

.bar{
  height:18px;
  border-radius:999px;
  background:linear-gradient(to right,#10b981,#06b6d4);
}

.card{
  background:#0f172a;
  border-radius:18px;
  padding:14px;
}

</style>

</head>

<body class="min-h-screen p-4">

<div class="max-w-md mx-auto">

<div class="glass rounded-3xl p-5 shadow-2xl">

<!-- HEADER -->

<h1 class="text-3xl font-bold text-center mb-2">
🎯 Turbo Lotto AI PRO MAX
</h1>

<p class="text-center text-emerald-400 mb-6">
AI Prediction + Heatmap + API + Trend
</p>

<!-- MODE -->

<div class="flex gap-3 mb-6">

<button
id="thaiBtn"
class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold">
🇹🇭 หวยไทย
</button>

<button
id="laoBtn"
class="flex-1 bg-slate-800 py-3 rounded-xl font-bold">
🇱🇦 หวยลาว
</button>

</div>

<!-- BUTTON -->

<button
id="generateBtn"
class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 py-4 rounded-2xl font-bold text-lg mb-6">
🚀 วิเคราะห์เลข AI
</button>

<!-- MAIN -->

<div class="mb-6">

<h2 class="font-bold mb-3 text-slate-300">
รางวัลหลัก
</h2>

<div
id="mainContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- 3 DIGIT -->

<div class="mb-6">

<h2 class="font-bold mb-3 text-slate-300">
3 ตัวท้าย
</h2>

<div
id="threeContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- 2 DIGIT -->

<div class="mb-6">

<h2 class="font-bold mb-3 text-slate-300">
2 ตัวท้าย
</h2>

<div
id="twoContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- BOTTOM -->

<div class="mb-6">

<h2 class="font-bold mb-3 text-yellow-400">
2 ตัวล่าง
</h2>

<div
id="bottomContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- AI SCORE -->

<div class="glass rounded-2xl p-4 mb-6">

<div class="flex justify-between mb-2">

<span>
AI Confidence
</span>

<span id="scoreText">
0%
</span>

</div>

<div class="w-full bg-slate-800 rounded-full overflow-hidden">

<div
id="scoreBar"
class="bar w-0">
</div>

</div>

</div>

<!-- HOT DIGITS -->

<div class="glass rounded-2xl p-4 mb-6">

<h2 class="font-bold mb-4">
🔥 Hot Digits
</h2>

<div
id="hotDigits"
class="grid grid-cols-5 gap-2">
</div>

</div>

<!-- HEATMAP -->

<div class="glass rounded-2xl p-4 mb-6">

<h2 class="font-bold mb-4">
📊 Heatmap
</h2>

<div
id="heatmap"
class="space-y-3">
</div>

</div>

<!-- PAIR -->

<div class="glass rounded-2xl p-4 mb-6">

<h2 class="font-bold mb-4">
🔗 Pair Analysis
</h2>

<div
id="pairContainer"
class="grid grid-cols-2 gap-3">
</div>

</div>

<!-- HISTORY -->

<div class="glass rounded-2xl p-4">

<h2 class="font-bold mb-4">
📁 ผลย้อนหลัง
</h2>

<div
id="history"
class="space-y-3">
</div>

</div>

</div>

</div>

<script>

/* =========================================
   MODE
========================================= */

let currentMode='thai';

/* =========================================
   ELEMENTS
========================================= */

const thaiBtn=
document.getElementById('thaiBtn');

const laoBtn=
document.getElementById('laoBtn');

const generateBtn=
document.getElementById('generateBtn');

const mainContainer=
document.getElementById('mainContainer');

const threeContainer=
document.getElementById('threeContainer');

const twoContainer=
document.getElementById('twoContainer');

const bottomContainer=
document.getElementById('bottomContainer');

const historyContainer=
document.getElementById('history');

const pairContainer=
document.getElementById('pairContainer');

const heatmap=
document.getElementById('heatmap');

const hotDigitsContainer=
document.getElementById('hotDigits');

/* =========================================
   HISTORY DATA
========================================= */

const historyData={

thai:[

{
date:'16 พ.ค. 2568',
main:'251309',
bottom:'87'
},

{
date:'2 พ.ค. 2568',
main:'213388',
bottom:'06'
},

{
date:'16 เม.ย. 2568',
main:'266227',
bottom:'85'
},

{
date:'1 เม.ย. 2568',
main:'669687',
bottom:'36'
}

],

lao:[

{
date:'21 พ.ค. 2568',
main:'6384',
top:'84',
bottom:'63'
},

{
date:'19 พ.ค. 2568',
main:'4127',
top:'27',
bottom:'41'
},

{
date:'16 พ.ค. 2568',
main:'9751',
top:'51',
bottom:'97'
}

]

};

/* =========================================
   RANDOM
========================================= */

function secureRandom(max){

const array=
new Uint32Array(1);

crypto.getRandomValues(array);

return array[0]%max;

}

/* =========================================
   SAVE DATA
========================================= */

function saveData(){

localStorage.setItem(
'lottoData',
JSON.stringify(historyData)
);

}

/* =========================================
   LOAD DATA
========================================= */

function loadData(){

const saved=
localStorage.getItem(
'lottoData'
);

if(saved){

const parsed=
JSON.parse(saved);

historyData.thai=
parsed.thai || historyData.thai;

historyData.lao=
parsed.lao || historyData.lao;

}

}

/* =========================================
   SAFE FETCH
========================================= */

async function safeFetch(
url,
timeout=5000
){

const controller=
new AbortController();

const timer=
setTimeout(()=>{

controller.abort();

},timeout);

try{

const response=
await fetch(url,{
signal:controller.signal
});

clearTimeout(timer);

return response;

}catch(error){

clearTimeout(timer);

throw error;

}

}

/* =========================================
   FETCH THAI API
========================================= */

async function fetchThaiLotto(){

try{

const response=
await safeFetch(
'https://lotto.api.rayriffy.com/latest'
);

const data=
await response.json();

const firstPrize=
data.response.prizes.find(
p=>p.id==='first'
);

const lastTwo=
data.response.runningNumbers.find(
n=>n.id==='lastTwo'
);

if(!firstPrize || !lastTwo){

return;

}

const newResult={

date:data.response.date,

main:firstPrize.number,

bottom:lastTwo.number

};

const exists=
historyData.thai.some(
item=>item.date===newResult.date
);

if(!exists){

historyData.thai.unshift(
newResult
);

historyData.thai=
historyData.thai.slice(0,200);

saveData();

}

updateAll();

}catch(error){

console.log(
'โหลด API ไม่สำเร็จ',
error
);

}

}

/* =========================================
   HISTORY
========================================= */

function renderHistory(){

historyContainer.innerHTML='';

historyData[currentMode]
.forEach(item=>{

const div=
document.createElement('div');

div.className='card';

if(currentMode==='thai'){

div.innerHTML=`

<div class="flex justify-between">

<span class="text-emerald-400">
${item.date}
</span>

<span class="text-yellow-400">
ล่าง ${item.bottom}
</span>

</div>

<div class="text-2xl font-bold mt-2 tracking-widest">
${item.main}
</div>

`;

}else{

div.innerHTML=`

<div class="flex justify-between">

<span class="text-red-400">
${item.date}
</span>

<span class="text-cyan-400">
บน ${item.top}
</span>

</div>

<div class="text-2xl font-bold mt-2 tracking-widest">
${item.main}
</div>

<div class="text-sm text-yellow-400 mt-1">
ล่าง ${item.bottom}
</div>

`;

}

historyContainer.appendChild(div);

});

}

/* =========================================
   FREQUENCY
========================================= */

function getFrequency(position){

const freq={};

for(let i=0;i<=9;i++){

freq[i]=1;

}

historyData[currentMode]
.forEach((item,index)=>{

const digit=
item.main[position];

if(digit!==undefined){

freq[digit]+=
historyData[currentMode].length
-index;

}

});

return freq;

}

/* =========================================
   WEIGHTED PICK
========================================= */

function weightedPick(freq){

const pool=[];

Object.entries(freq)
.forEach(([digit,score])=>{

for(let i=0;i<score;i++){

pool.push(digit);

}

});

return pool[
secureRandom(pool.length)
];

}

/* =========================================
   GENERATE NUMBER
========================================= */

function generateNumber(){

let result='';

const length=
currentMode==='thai'
?6
:4;

for(let pos=0;pos<length;pos++){

const freq=
getFrequency(pos);

result+=
weightedPick(freq);

}

return result;

}

/* =========================================
   REPEAT CHECK
========================================= */

function hasTooManyRepeats(number){

const counts={};

number.split('')
.forEach(n=>{

counts[n]=
(counts[n]||0)+1;

});

return Object.values(counts)
.some(count=>count>=4);

}

/* =========================================
   HOT DIGITS
========================================= */

function getHotDigits(){

const freq={};

for(let i=0;i<=9;i++){

freq[i]=0;

}

historyData[currentMode]
.forEach((item,index)=>{

const weight=
historyData[currentMode].length
-index;

item.main
.split('')
.forEach(digit=>{

freq[digit]+=weight;

});

});

return Object.entries(freq)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

}

/* =========================================
   RENDER HOT DIGITS
========================================= */

function renderHotDigits(){

hotDigitsContainer.innerHTML='';

const hot=
getHotDigits();

hot.forEach(item=>{

const div=
document.createElement('div');

div.className=
'bg-slate-900 rounded-xl p-3 text-center';

div.innerHTML=`

<div class="text-2xl font-bold text-orange-400">
${item[0]}
</div>

<div class="text-xs text-slate-400">
score ${item[1]}
</div>

`;

hotDigitsContainer.appendChild(div);

});

}

/* =========================================
   PAIRS
========================================= */

function getPairAnalysis(){

const pairs={};

historyData[currentMode]
.forEach(item=>{

const num=item.main;

for(let i=0;i<num.length-1;i++){

const pair=
num[i]+num[i+1];

pairs[pair]=
(pairs[pair]||0)+1;

}

});

return Object.entries(pairs)
.sort((a,b)=>b[1]-a[1])
.slice(0,6);

}

/* =========================================
   RENDER PAIRS
========================================= */

function renderPairs(){

pairContainer.innerHTML='';

const topPairs=
getPairAnalysis();

topPairs.forEach(pair=>{

const div=
document.createElement('div');

div.className='card';

div.innerHTML=`

<div class="text-2xl font-bold text-cyan-400">
${pair[0]}
</div>

<div class="text-xs text-slate-400">
${pair[1]} times
</div>

`;

pairContainer.appendChild(div);

});

}

/* =========================================
   HEATMAP
========================================= */

function renderHeatmap(){

heatmap.innerHTML='';

const length=
currentMode==='thai'
?6
:4;

for(let pos=0;pos<length;pos++){

const freq=
getFrequency(pos);

const total=
Object.values(freq)
.reduce((a,b)=>a+b,0);

const topDigit=
Object.entries(freq)
.sort((a,b)=>b[1]-a[1])[0];

const percent=
Math.floor(
(topDigit[1]/total)*100
);

const row=
document.createElement('div');

row.innerHTML=`

<div class="flex justify-between text-sm mb-1">

<span>
หลัก ${pos+1}
</span>

<span>
เลขเด่น ${topDigit[0]}
</span>

</div>

<div class="w-full bg-slate-800 rounded-full overflow-hidden">

<div
class="bar"
style="width:${percent}%">
</div>

</div>

`;

heatmap.appendChild(row);

}

}

/* =========================================
   CONFIDENCE
========================================= */

function calculateConfidence(number){

let score=0;

number.split('')
.forEach((digit,pos)=>{

const freq=
getFrequency(pos);

score+=freq[digit];

});

const pairs=
getPairAnalysis();

for(let i=0;i<number.length-1;i++){

const pair=
number[i]+number[i+1];

pairs.forEach(p=>{

if(p[0]===pair){

score+=15;

}

});

}

if(hasTooManyRepeats(number)){

score-=50;

}

return Math.max(
1,
Math.min(
99,
Math.floor(score/5)
)
);

}

/* =========================================
   BALLS
========================================= */

function renderBalls(
container,
number,
color
){

container.innerHTML='';

number.split('')
.forEach(n=>{

const div=
document.createElement('div');

div.className=
`ball ${color}`;

div.innerText=n;

container.appendChild(div);

});

}

/* =========================================
   AI GENERATE
========================================= */

function generateAI(){

generateBtn.disabled=true;

generateBtn.innerText=
'AI กำลังวิเคราะห์...';

const loading=
`<div class="ball loading bg-slate-700">⚡</div>`;

mainContainer.innerHTML=
loading;

threeContainer.innerHTML=
loading;

twoContainer.innerHTML=
loading;

bottomContainer.innerHTML=
loading;

setTimeout(()=>{

let bestNumber='';
let bestScore=0;

for(let i=0;i<30;i++){

let candidate='';

do{

candidate=
generateNumber();

}
while(
hasTooManyRepeats(candidate)
);

const score=
calculateConfidence(candidate);

if(score>bestScore){

bestScore=score;
bestNumber=candidate;

}

}

const three=
bestNumber.slice(-3);

const two=
bestNumber.slice(-2);

let bottom='';

if(currentMode==='thai'){

bottom=
generateNumber()
.slice(-2);

}else{

bottom=
bestNumber.slice(0,2);

}

renderBalls(
mainContainer,
bestNumber,
currentMode==='thai'
?
'bg-gradient-to-br from-emerald-500 to-teal-700'
:
'bg-gradient-to-br from-red-500 to-rose-700'
);

renderBalls(
threeContainer,
three,
'bg-gradient-to-br from-violet-500 to-indigo-700'
);

renderBalls(
twoContainer,
two,
'bg-gradient-to-br from-blue-500 to-cyan-700'
);

renderBalls(
bottomContainer,
bottom,
'bg-gradient-to-br from-yellow-500 to-orange-600'
);

document
.getElementById('scoreText')
.innerText=
bestScore+'%';

document
.getElementById('scoreBar')
.style.width=
bestScore+'%';

generateBtn.disabled=false;

generateBtn.innerText=
'🚀 วิเคราะห์เลข AI';

},1200);

}

/* =========================================
   UPDATE ALL
========================================= */

function updateAll(){

renderHistory();

renderHeatmap();

renderPairs();

renderHotDigits();

}

/* =========================================
   MODE SWITCH
========================================= */

thaiBtn.onclick=()=>{

currentMode='thai';

thaiBtn.className=
'flex-1 bg-emerald-600 py-3 rounded-xl font-bold';

laoBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

updateAll();

};

laoBtn.onclick=()=>{

currentMode='lao';

laoBtn.className=
'flex-1 bg-red-600 py-3 rounded-xl font-bold';

thaiBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

updateAll();

};

/* =========================================
   INIT
========================================= */

loadData();

updateAll();

fetchThaiLotto();

generateBtn.onclick=
generateAI;

setInterval(()=>{

fetchThaiLotto();

},3600000);

</script>

</body>
</html>
