<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turbo Lotto AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
  background:#020617;
  color:white;
  font-family:sans-serif;
}

.glass{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);
}

.ball{
  width:70px;
  height:70px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  color:white;
  animation:pop .4s ease;
}

@keyframes pop{
  0%{
    transform:scale(.5);
    opacity:0;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

.loading{
  animation:pulse 1s infinite;
}

.bar{
  height:20px;
  border-radius:999px;
  background:linear-gradient(to right,#10b981,#14b8a6);
}

</style>

</head>

<body class="min-h-screen p-4">

<div class="max-w-md mx-auto">

<div class="glass rounded-3xl p-5 shadow-2xl">

<h1 class="text-3xl font-bold text-center mb-2">
 Turbo Lotto AI
</h1>

<p class="text-center text-emerald-400 mb-6">
AI 
</p>

<!-- MODE -->

<div class="flex gap-3 mb-6">

<button
id="thaiBtn"
class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold">
 
</button>

<button
id="laoBtn"
class="flex-1 bg-slate-800 py-3 rounded-xl font-bold">
 
</button>

</div>

<!-- BUTTON -->

<button
id="generateBtn"
class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 py-4 rounded-2xl font-bold text-lg mb-6">
 
</button>

<!-- MAIN -->

<div class="mb-6">

<h2 class="font-bold mb-3 text-slate-300">

</h2>

<div
id="mainContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- 3 DIGIT -->

<div class="mb-6">

<h2 class="font-bold mb-3 text-slate-300">
3 
</h2>

<div
id="threeContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- 2 DIGIT -->

<div class="mb-6">

<h2 class="font-bold mb-3 text-slate-300">
2 
</h2>

<div
id="twoContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- BOTTOM -->

<div class="mb-6">

<h2 class="font-bold mb-3 text-yellow-400">
2 
</h2>

<div
id="bottomContainer"
class="flex justify-center gap-2 flex-wrap">
</div>

</div>

<!-- SCORE -->

<div class="glass rounded-2xl p-4 mb-6">

<div class="flex justify-between mb-2">
<span>AI Confidence</span>
<span id="scoreText">0%</span>
</div>

<div class="w-full bg-slate-800 rounded-full overflow-hidden">

<div
id="scoreBar"
class="bar w-0">
</div>

</div>

</div>

<!-- HEATMAP -->

<div class="glass rounded-2xl p-4 mb-6">

<h2 class="font-bold mb-4">
 Heatmap
</h2>

<div id="heatmap" class="space-y-3"></div>

</div>

<!-- HISTORY -->

<div class="glass rounded-2xl p-4">

<h2 class="font-bold mb-4">
 History
</h2>

<div id="history" class="space-y-3"></div>

</div>

</div>

</div>

<script>

let currentMode='thai';

const historyData={

thai:[
  {
    date:'16 .. 69',
    main:'985452',
    bottom:'95'
  },
  {
    date:'2 .. 69',
    main:'284729',
    bottom:'38'
  },
  {
    date:'16 .. 69',
    main:'543118',
    bottom:'21'
  },
  {
    date:'1 .. 69',
    main:'074205',
    bottom:'64'
  },
  {
    date:'16 .. 69',
    main:'998887',
    bottom:'09'
  }
],

lao:[
  {
    date:'20 .. 69',
    main:'8769'
  },
  {
    date:'18 .. 69',
    main:'9572'
  },
  {
    date:'15 .. 69',
    main:'3417'
  },
  {
    date:'13 .. 69',
    main:'7804'
  },
  {
    date:'11 .. 69',
    main:'1932'
  }
]

};

const thaiBtn=
document.getElementById('thaiBtn');

const laoBtn=
document.getElementById('laoBtn');

const generateBtn=
document.getElementById('generateBtn');

const mainContainer=
document.getElementById('mainContainer');

const threeContainer=
document.getElementById('threeContainer');

const twoContainer=
document.getElementById('twoContainer');

const bottomContainer=
document.getElementById('bottomContainer');

const historyContainer=
document.getElementById('history');

const heatmap=
document.getElementById('heatmap');

function renderHistory(){

  historyContainer.innerHTML='';

  historyData[currentMode].forEach(item=>{

    const div=document.createElement('div');

    div.className=
    'bg-slate-900 rounded-xl p-3';

    if(currentMode==='thai'){

      div.innerHTML=`

      <div class="flex justify-between">

        <span class="text-emerald-400">
          ${item.date}
        </span>

        <span class="text-yellow-400">
          ${item.bottom}
        </span>

      </div>

      <div class="text-2xl font-bold tracking-widest mt-2">
        ${item.main}
      </div>

      `;

    }else{

      const top2=item.main.slice(-2);

      const bottom2=item.main.slice(0,2);

      div.innerHTML=`

      <div class="flex justify-between">

        <span class="text-red-400">
          ${item.date}
        </span>

        <span class="text-yellow-400">
          ${bottom2}
        </span>

      </div>

      <div class="text-2xl font-bold tracking-widest mt-2">
        ${item.main}
      </div>

      <div class="text-sm text-slate-400 mt-1">
         ${top2} |  ${bottom2}
      </div>

      `;
    }

    historyContainer.appendChild(div);

  });

}

function getFrequency(position){

  const freq={};

  for(let i=0;i<=9;i++){
    freq[i]=1;
  }

  historyData[currentMode].forEach(item=>{

    const digit=item.main[position];

    if(digit!==undefined){

      freq[digit]+=3;

    }

  });

  return freq;

}

function weightedPick(freq){

  const pool=[];

  Object.entries(freq).forEach(([digit,score])=>{

    for(let i=0;i<score;i++){

      pool.push(digit);

    }

  });

  return pool[
    Math.floor(Math.random()*pool.length)
  ];

}

function generateNumber(){

  let result='';

  const length=
  currentMode==='thai' ? 6 : 4;

  for(let pos=0;pos<length;pos++){

    const freq=getFrequency(pos);

    result+=weightedPick(freq);

  }

  return result;

}

function renderBalls(container,number,color){

  container.innerHTML='';

  number.split('').forEach(n=>{

    const div=document.createElement('div');

    div.className=
    `ball ${color}`;

    div.innerText=n;

    container.appendChild(div);

  });

}

function renderHeatmap(){

  heatmap.innerHTML='';

  const length=
  currentMode==='thai' ? 6 : 4;

  for(let pos=0;pos<length;pos++){

    const freq=getFrequency(pos);

    const max=
    Math.max(...Object.values(freq));

    const topDigit=
    Object.entries(freq)
    .sort((a,b)=>b[1]-a[1])[0];

    const percent=
    Math.floor((topDigit[1]/max)*100);

    const row=document.createElement('div');

    row.innerHTML=`

    <div class="flex justify-between text-sm mb-1">

      <span> ${pos+1}</span>

      <span>${topDigit[0]}</span>

    </div>

    <div class="w-full bg-slate-800 rounded-full overflow-hidden">

      <div
      class="bar"
      style="width:${percent}%">
      </div>

    </div>

    `;

    heatmap.appendChild(row);

  }

}

function generateAI(){

  generateBtn.innerText=
  '...';

  const loading=
  `<div class="ball loading bg-slate-700"></div>`;

  mainContainer.innerHTML=loading;
  threeContainer.innerHTML=loading;
  twoContainer.innerHTML=loading;
  bottomContainer.innerHTML=loading;

  setTimeout(()=>{

    const number=
    generateNumber();

    const three=
    number.slice(-3);

    const two=
    number.slice(-2);

    let bottom='';

    if(currentMode==='thai'){

      bottom=
      generateNumber().slice(-2);

    }else{

      bottom=
      number.slice(0,2);

    }

    renderBalls(
      mainContainer,
      number,
      currentMode==='thai'
      ?
      'bg-gradient-to-br from-emerald-500 to-teal-700'
      :
      'bg-gradient-to-br from-red-500 to-rose-700'
    );

    renderBalls(
      threeContainer,
      three,
      'bg-gradient-to-br from-violet-500 to-indigo-700'
    );

    renderBalls(
      twoContainer,
      two,
      'bg-gradient-to-br from-blue-500 to-cyan-700'
    );

    renderBalls(
      bottomContainer,
      bottom,
      'bg-gradient-to-br from-yellow-500 to-orange-600'
    );

    const score=
    Math.floor(Math.random()*20)+80;

    document.getElementById('scoreText')
    .innerText=score+'%';

    document.getElementById('scoreBar')
    .style.width=score+'%';

    generateBtn.innerText=
    ' ';

  },1200);

}

thaiBtn.onclick=()=>{

  currentMode='thai';

  thaiBtn.className=
  'flex-1 bg-emerald-600 py-3 rounded-xl font-bold';

  laoBtn.className=
  'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

  renderHistory();
  renderHeatmap();

};

laoBtn.onclick=()=>{

  currentMode='lao';

  laoBtn.className=
  'flex-1 bg-red-600 py-3 rounded-xl font-bold';

  thaiBtn.className=
  'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

  renderHistory();
  renderHeatmap();

};

renderHistory();
renderHeatmap();

generateBtn.onclick=generateAI;

</script>

</body>
</html>
