<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turbo Lotto AI Neural</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<style>

body{
font-family:'Kanit',sans-serif;
background:#020617;
color:white;
}

.glass{
background:rgba(255,255,255,.05);
backdrop-filter:blur(6px);
border:1px solid rgba(255,255,255,.1);
}

.ball{

width:70px;
height:70px;
border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
font-weight:bold;

color:white;

animation:pop .4s ease;

}

@keyframes pop{

0%{
transform:scale(.4);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

</style>

</head>

<body class="p-5">

<div class="max-w-md mx-auto glass p-5 rounded-3xl">

<h1 class="text-3xl font-bold text-center">
🧠 Turbo Lotto Neural AI
</h1>

<p class="text-center text-cyan-400 mb-5">
TensorFlow.js Dense Neural Network
</p>

<button
id="generateBtn"
class="w-full bg-violet-600 p-4 rounded-xl font-bold mb-6">

🚀 วิเคราะห์เลข AI

</button>

<div class="mb-5">

<h2 class="font-bold mb-2">
รางวัลหลัก
</h2>

<div
id="mainContainer"
class="flex gap-2 flex-wrap justify-center">
</div>

</div>

<div class="mb-5">

<h2 class="font-bold mb-2">
3 ตัวท้าย
</h2>

<div
id="threeContainer"
class="flex gap-2 flex-wrap justify-center">
</div>

</div>

<div class="mb-5">

<h2 class="font-bold mb-2">
2 ตัวท้าย
</h2>

<div
id="twoContainer"
class="flex gap-2 flex-wrap justify-center">
</div>

</div>

<div class="mb-5">

<h2 class="font-bold mb-2">
2 ตัวล่าง
</h2>

<div
id="bottomContainer"
class="flex gap-2 flex-wrap justify-center">
</div>

</div>

<div
id="confidenceBox"
class="glass p-5 rounded-xl text-center">

--

</div>

</div>

<script>

/* =========================
DATA
========================= */

const thaiNumbers=[

"985452",
"284729",
"543118",
"074205",
"998887",
"125272",
"361807",
"762514",
"904225",
"813690",
"592318"

];

/* =========================
ELEMENTS
========================= */

const generateBtn=
document.getElementById("generateBtn");

const mainContainer=
document.getElementById("mainContainer");

const threeContainer=
document.getElementById("threeContainer");

const twoContainer=
document.getElementById("twoContainer");

const bottomContainer=
document.getElementById("bottomContainer");

const confidenceBox=
document.getElementById("confidenceBox");


/* =========================
RENDER
========================= */

function renderBalls(
container,
number,
color
){

container.innerHTML='';

number.split('').forEach(n=>{

const div=
document.createElement('div');

div.className=
`ball ${color}`;

div.innerText=n;

container.appendChild(div);

});

}

/* =========================
DATASET
========================= */

function createDataset(){

const xs=[];
const ys=[];

const windowSize=3;

for(
let i=0;
i<thaiNumbers.length-windowSize;
i++
){

let input=[];

for(
let j=0;
j<windowSize;
j++
){

input.push(
...thaiNumbers[
i+j
]
.split('')
.map(
x=>Number(x)/9
)
);

}

const output=
thaiNumbers[
i+windowSize
]
.split('')
.map(
x=>Number(x)/9
);

xs.push(input);

ys.push(output);

}

return{

xs:tf.tensor2d(xs),
ys:tf.tensor2d(ys)

};

}

/* =========================
MODEL
========================= */

function createModel(){

const model=
tf.sequential();

model.add(

tf.layers.dense({

inputShape:[18],
units:128,
activation:'relu'

})

);

model.add(

tf.layers.dense({

units:64,
activation:'relu'

})

);

model.add(

tf.layers.dense({

units:32,
activation:'relu'

})

);

model.add(

tf.layers.dense({

units:6,
activation:'sigmoid'

})

);

model.compile({

optimizer:'adam',
loss:'meanSquaredError'

});

return model;

}

/* =========================
TRAIN
========================= */

async function trainModel(){

const data=
createDataset();

const model=
createModel();

const history=
await model.fit(

data.xs,
data.ys,

{

epochs:300,
shuffle:true,

}

);

const loss=
history.history.loss.pop();

return{

model,
loss

};

}

/* =========================
PREDICT
========================= */

async function predict(){

const result=
await trainModel();

const model=
result.model;

const loss=
result.loss;

const last3=
thaiNumbers
.slice(-3);

let input=[];

last3.forEach(n=>{

input.push(
...n
.split('')
.map(
x=>Number(x)/9
)
);

});

const prediction=
model.predict(
tf.tensor2d([input])
);

const values=
await prediction.data();

let number='';

values.forEach(v=>{

let digit=
Math.round(v*9);

digit=
Math.max(
0,
Math.min(9,digit)
);

number+=digit;

});

let confidence=
Math.max(
50,
Math.round(
100-(loss*1000)
)
);

return{

number,
confidence

};

}

/* =========================
GENERATE
========================= */

async function generateAI(){

generateBtn.disabled=true;

generateBtn.innerText=
"⏳ AI กำลังเรียนรู้...";

const result=
await predict();

const number=
result.number;

renderBalls(
mainContainer,
number,
'bg-emerald-600'
);

renderBalls(
threeContainer,
number.slice(-3),
'bg-violet-600'
);

renderBalls(
twoContainer,
number.slice(-2),
'bg-blue-600'
);

renderBalls(
bottomContainer,
number.slice(2,4),
'bg-yellow-500'
);

confidenceBox.innerHTML=`

<div class="text-5xl font-bold text-green-400">

${result.confidence}%

</div>

<div>
Neural Confidence
</div>

`;

generateBtn.disabled=false;

generateBtn.innerText=
"🚀 วิเคราะห์เลข AI";

}

generateBtn.onclick=
generateAI;

</script>

</body>
</html>
